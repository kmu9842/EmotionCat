name: Quantization experiment
on:
  workflow_dispatch:
  push:
    branches: [onnx-native]
    paths: ["tools/onnx/quant_experiment.py", ".github/workflows/quant-experiment.yml"]
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - name: Fetch fp32 model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODEL_RELEASE: model-v1
        run: bash scripts/fetch-model.sh model laya-multilingual-fp32.onnx
      - name: Compare variants on this CPU
        shell: bash
        run: |
          python -m pip install -q onnxruntime==1.23.2 onnx numpy
          python -c "import platform; print(platform.processor())"; (lscpu 2>/dev/null | grep -E 'Model name|Flags' | cut -c1-400) || true
          python tools/onnx/quant_experiment.py model/laya-multilingual-fp32.onnx tools/onnx/eval-inputs.json model
