name: Windows build
on:
  workflow_dispatch:
  push:
    paths: ["src/**", "build.ps1", "app.manifest", "scripts/prepare-windows.ps1", "tools/onnx/prepare_directml.py", "tools/onnx/requirements-directml.txt", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["src/**", "build.ps1", "app.manifest", "scripts/prepare-windows.ps1", "tools/onnx/prepare_directml.py", "tools/onnx/requirements-directml.txt", ".github/workflows/windows.yml"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare DirectML runtime and GPU model (SHA-256 pinned)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/prepare-windows.ps1
      - name: Compile Windows application
        shell: pwsh
        run: ./build.ps1
