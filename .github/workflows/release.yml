name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v1.0.0)"
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  MODEL_RELEASE: model-v2
  MODEL_SHA256: 9f31d5cbd39cd3795becdf209f0934b40acc3840f1d9e8bd777d05f12158567e
  TOKENIZER_SHA256: 32fa4053b15e4ea0791340f1092e93eb682b158d7c35972c933f46ab03bc22b4
jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release (build assets go here, not to Actions artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          ## 다운로드

          | OS | 파일 |
          |---|---|
          | Windows 10/11 x64 + DirectX 12 하드웨어 GPU | `EmotionCat-*-windows-x64.zip` — 압축을 풀고 `EmotionCat.exe` 실행 (.NET Framework 4.8 및 DirectML/DXCore 지원 그래픽 드라이버 필요) |
          | macOS 13.4+ (Apple Silicon / Intel) | `EmotionCat-*-macOS-universal.zip` — 압축을 풀고 `EmotionCat.app`을 `/Applications`로 이동 |

          - Linux 데스크톱 앱은 아직 없습니다.
          - 모델과 실행 라이브러리가 앱에 포함됩니다. **추가 다운로드나 Python 설치 없이** 동작합니다. Windows는 FP16·DirectML GPU 전용이며, GPU를 사용할 수 없으면 경고 후 감정 분석을 끕니다. CPU 추론으로 전환하지 않습니다.
          - Windows와 macOS 모두 입력 수집 시작부터 1초를 폐기 기한으로 사용합니다. 새 입력과 대기열 이동으로 기한을 연장하지 않으며, 원문 진단 표시·보관을 제거했습니다.
          - 비밀번호 필드 판별은 제거했습니다. 입력 내용은 내장 모델로만 분석하며 ONNX Runtime 텔레메트리는 끄고, 네트워크 파일 경로를 거부합니다.
          - 감정 인식은 기본적으로 꺼져 있습니다. 기존 설정도 이번 업데이트에서 꺼지므로, 설정에서 직접 켜 주세요.
          - Windows 앱은 공인 코드 서명을 포함하지 않습니다. macOS는 인증서 없는 ad-hoc 서명으로 빌드하며 Apple 공증은 포함하지 않습니다.
          - macOS는 처음 실행 때 **입력 모니터링** 권한이 필요합니다. 감정 인식은 설정에서 직접 켜며, 입력 원문은 최대 1초 후 폐기합니다.
          - 각 ZIP 옆 `.sha256` 파일로 무결성을 확인할 수 있습니다.
          - 1초 폐기는 앱이 소유한 버퍼·참조의 수명 정책이며 OS·런타임 내부 복사본의 물리적 삭제까지 보장하지 않습니다. 자세한 범위는 저장소의 `docs/security.md`에 설명되어 있습니다.
          EOF
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > release-state 2>/dev/null; then
            [[ "$(cat release-state)" == true ]] || { echo 'Refusing to replace a published release.' >&2; exit 1; }
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --draft --title "EmotionCat $TAG" --notes-file notes.md
          fi

  windows:
    needs: draft
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare DirectML runtime and GPU model (SHA-256 pinned)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/prepare-windows.ps1
      - name: Compile Windows application
        shell: pwsh
        run: ./build.ps1
      - name: Pack portable ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'EmotionCat'
          New-Item -ItemType Directory -Force -Path "$stage/assets" | Out-Null
          Copy-Item EmotionCat.exe, EmotionCat.exe.config, 'Start EmotionCat.cmd', README.md, onnxruntime.dll, DirectML.dll -Destination $stage
          Copy-Item assets/frames, assets/sprites -Destination "$stage/assets" -Recurse
          Copy-Item assets/emotioncat.ico -Destination "$stage/assets"
          New-Item -ItemType Directory -Force -Path "$stage/docs" | Out-Null
          Copy-Item docs/security.md -Destination "$stage/docs"
          New-Item -ItemType Directory -Force -Path "$stage/model" | Out-Null
          Copy-Item model/laya-multilingual-gpu.onnx, model/tokenizer.bin -Destination "$stage/model"
          Copy-Item licenses -Destination $stage -Recurse
          $zip = "EmotionCat-$env:TAG-windows-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File -Encoding ascii "$zip.sha256"
      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" EmotionCat-*-windows-x64.zip* --clobber

  macos:
    needs: draft
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Fetch the bundled model (SHA-256 pinned)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/fetch-model.sh "$RUNNER_TEMP/model"
      - name: Compile Universal app with certificate-free ad-hoc signing
        env:
          EMOTIONCAT_MODEL_DIR: ${{ runner.temp }}/model
        run: |
          bash macos/build.sh
          codesign -d -r- macos/build/EmotionCat.app 2>&1 | tail -1
      - name: Pack application bundle
        run: |
          zip="EmotionCat-${TAG}-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent macos/build/EmotionCat.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" EmotionCat-*-macOS-universal.zip* --clobber

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest
