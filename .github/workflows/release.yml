name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v1.1.0)"
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  MODEL_RELEASE: model-v2
  MODEL_SHA256: 9f31d5cbd39cd3795becdf209f0934b40acc3840f1d9e8bd777d05f12158567e
  TOKENIZER_SHA256: 32fa4053b15e4ea0791340f1092e93eb682b158d7c35972c933f46ab03bc22b4
  ORT_WIN_URL: https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-win-x64-1.23.2.zip
  ORT_WIN_SHA256: 0b38df9af21834e41e73d602d90db5cb06dbd1ca618948b8f1d66d607ac9f3cd
jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release (build assets go here, not to Actions artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          ## 다운로드

          | OS | 파일 |
          |---|---|
          | Windows 10/11 x64 | `EmotionCat-*-windows-x64.zip` — 압축을 풀고 `EmotionCat.exe` 실행 (.NET Framework 4.8 필요, Windows 10/11 기본 포함) |
          | macOS 13.4+ (Apple Silicon / Intel) | `EmotionCat-*-macOS-universal.zip` — 압축을 풀고 `EmotionCat.app`을 `/Applications`로 이동 |

          - Linux 데스크톱 앱은 아직 없습니다.
          - 감정 모델(Laya multilingual 322M, ONNX int8)과 ONNX Runtime이 앱 안에 들어 있습니다. **추가 다운로드나 Python 설치 없이** 압축만 풀면 바로 동작합니다.
          - macOS 앱은 Apple 공증을 받지 않은 자체 서명 앱이라, 처음 실행 시 차단되면 `xattr -dr com.apple.quarantine /Applications/EmotionCat.app` 실행 후 다시 여세요.
          - macOS는 처음 실행 때 **입력 모니터링**·**손쉬운 사용** 권한을 허용해야 고양이가 키 입력에 반응합니다. 같은 인증서로 서명하므로 업데이트 후에도 권한이 유지됩니다.
          - 각 ZIP 옆 `.sha256` 파일로 무결성을 확인할 수 있습니다.
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "EmotionCat $TAG" --notes-file notes.md
          fi

  windows:
    needs: draft
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Fetch ONNX Runtime and the bundled model (SHA-256 pinned)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          Invoke-WebRequest -UseBasicParsing $env:ORT_WIN_URL -OutFile ort.zip
          if ((Get-FileHash ort.zip -Algorithm SHA256).Hash.ToLower() -ne $env:ORT_WIN_SHA256) { throw 'ONNX Runtime checksum mismatch.' }
          Expand-Archive ort.zip -DestinationPath ort
          $ortDir = Get-ChildItem ort -Directory | Select-Object -First 1
          Copy-Item "$($ortDir.FullName)/lib/onnxruntime.dll" -Destination .
          New-Item -ItemType Directory -Force -Path model, licenses | Out-Null
          Copy-Item "$($ortDir.FullName)/LICENSE" -Destination licenses/ONNXRuntime-LICENSE.txt
          Copy-Item "$($ortDir.FullName)/ThirdPartyNotices.txt" -Destination licenses/ONNXRuntime-ThirdPartyNotices.txt
          bash scripts/fetch-model.sh model
          if ($LASTEXITCODE -ne 0) { throw 'Model download failed.' }
          Move-Item model/Laya-APACHE-2.0.txt licenses/
      - name: Compile EmotionCat.exe, run core, golden ONNX and live classification tests
        shell: pwsh
        run: |
          Remove-Item -LiteralPath EmotionCat.exe -Force
          ./build.ps1
          ./tests/run-core-tests.ps1 -Golden tests/onnx-golden.json -Integration
      - name: Pack portable ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'EmotionCat'
          New-Item -ItemType Directory -Force -Path "$stage/assets" | Out-Null
          Copy-Item EmotionCat.exe, EmotionCat.exe.config, 'Start EmotionCat.cmd', README.md, onnxruntime.dll -Destination $stage
          Copy-Item assets/frames, assets/sprites -Destination "$stage/assets" -Recurse
          Copy-Item assets/emotioncat.ico -Destination "$stage/assets"
          Copy-Item model, licenses -Destination $stage -Recurse
          $zip = "EmotionCat-$env:TAG-windows-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File -Encoding ascii "$zip.sha256"
      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" EmotionCat-*-windows-x64.zip* --clobber

  macos:
    needs: draft
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Fetch the bundled model (SHA-256 pinned)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/fetch-model.sh "$RUNNER_TEMP/model"
      - name: Import the stable signing certificate (keeps macOS permissions across updates)
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::warning::MACOS_SIGNING_P12 is not set; using ad-hoc signing (users must re-grant permissions after each update)."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"
          identity="$(security find-identity -p codesigning "$keychain" | awk '/EmotionCat Code Signing/ {print $2; exit}')"
          [[ -n "$identity" ]] || { echo "Signing identity not found."; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Compile Universal app, verify sprites and golden ONNX inference
        env:
          EMOTIONCAT_MODEL_DIR: ${{ runner.temp }}/model
        run: |
          bash macos/build.sh
          codesign -d -r- macos/build/EmotionCat.app 2>&1 | tail -1
      - name: Pack application bundle
        run: |
          zip="EmotionCat-${TAG}-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent macos/build/EmotionCat.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" EmotionCat-*-macOS-universal.zip* --clobber

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest
